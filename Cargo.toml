[workspace]
members = [
    "crates/workboard-core",
    "crates/workboard-native",
    "crates/workboard-adapter-claude",
    "crates/workboard-adapter-codex",
    "crates/workboard-application",
    "crates/workboard-client-protocol",
    "crates/workboard-client",
    "crates/workboard-daemon",
    "crates/workboard-cli",
    "apps/workboard-desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/tommyseery/agent-workboard"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6.0"
notify = "8.2"
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3.0"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing", "serde", "serde-well-known"] }
toml = "1.1"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "uuid-impl"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
