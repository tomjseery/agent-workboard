name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets

  windows-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: .\scripts\New-WindowsRelease.ps1
      - run: |
          $archive = (Get-ChildItem .\artifacts\release\*.zip).FullName
          .\scripts\Test-WindowsRelease.ps1 $archive
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-dogfood
          path: artifacts/release/*
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cargoVersion = ([regex]::Match((Get-Content -Raw Cargo.toml), '(?m)^version = "([^"]+)"$')).Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$cargoVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo version $cargoVersion"
          }
          $assets = @(Get-ChildItem .\artifacts\release -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "Agent Workboard $cargoVersion"

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run hook_input -- -max_total_time=30

